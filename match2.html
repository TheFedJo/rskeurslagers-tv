<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSKeurslagers-tv - 2v2 Wedstrijden</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="scripts/match_script.js"></script>
  <script defer src="scripts/player_complete.js"></script>
    <link rel="stylesheet" href="default_style.css">
</head>
<body>
  <div class="top-header">
      <h1>RSKeurslagers.tv</h1>
      <p><i>Tafelvoetbalstatistiek</i></p>
      <div class="button-bar">
          <a class="top-button" href="/match2">Wedstrijden 2v2</a>
          <a class="top-button" href="/match1">Wedstrijden 1v1</a>
          <a class="top-button" href="/players">Spelers</a>
      </div>

  </div>

  <div class="content">
      <div class="page-part">
        <div class="section-header">
            <h2>Wedstrijden invoeren</h2>
        </div>

        <form id="matchForm">
            <datalist id="playersList"></datalist>

            <fieldset class="team">
                <legend>Team 1</legend>
                <div class="form-player">
                    <label for="t1_p1">Speler 1</label>
                    <input type="text" id="t1_p1" placeholder="Hans" required class="player-input"  list="playersList"/>
                </div>
                <div class="form-player">
                    <label for="t1_p2">Speler 2</label>
                    <input type="text" id="t1_p2" placeholder="Andere Hans" required class="player-input" list="playersList"/>
                </div>
                <div class="form-score">
                    <label for="score_t1">Score</label>
                    <input type="number" id="score_t1" placeholder="0-25" value="10" step="1" min="0">
                </div>
            </fieldset>

            <fieldset class="team">
                <legend>Team 2</legend>
                <div class="form-player">
                    <label for="t2_p1">Speler 1</label>
                    <input type="text" id="t2_p1" placeholder="Diederick-Constantijn" required class="player-input"  list="playersList"/>
                </div>
                <div class="form-player">
                    <label for="t2_p2">Speler 2</label>
                    <input type="text" id="t2_p2" placeholder="Kees" required class="player-input" list="playersList"/>
                </div>
                <div class="form-score">
                    <label for="score_t2">Score</label>
                    <input type="number" id="score_t2" placeholder="0-25" value="10" step="1" min="0">
                </div>
            </fieldset>
            <p class="result-text" style="margin-bottom: -5px; margin-top: -5px" id="score-result"></p>
            <button type="submit">Wedstrijd toevoegen</button>
            <div id="error_match" style="display: none"><p>text</p></div>
        </form>
    </div>
  </div>


  <div class="page-part">
      <div class="3contain">
          <h2>Alle wedstrijden</h2>
      </div>
      <div class="table-container">
          <table id="matchesTable">
                <thead>
                    <tr>
                        <th class="table-team1" colspan="2" style="text-align: center;">Team 1</th>
                        <th class="table-team2" colspan="2" style="text-align: center;">Team 2</th>
                        <th class="table-score" rowspan="2" style="text-align: center;">Score</th>
                        <th class="table-date" rowspan="2" style="text-align: center;">Datum</th>
                    </tr>
                    <tr>
                        <th class="table-player11" colspan="1" style="top: 2rem">Speler 1</th>
                        <th class="table-player12" colspan="1" style="top: 2rem">Speler 2</th>
                        <th class="table-player21" colspan="1" style="top: 2rem">Speler 1</th>
                        <th class="table-player22" colspan="1" style="top: 2rem">Speler 2</th>
                    </tr>
                </thead>
                <tbody id="matchesBody"></tbody>
          </table>
      </div>
  </div>


        <span id="player_count_match" style="display:none;">2</span>
</body>
</html>
